<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>商业点子 & GitHub 热门项目</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .card-hover:hover { transform: translateY(-2px); box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1); }
        .tag-business { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); }
        .tag-tech { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); }
        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal-backdrop { background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); }
        .countdown { font-family: monospace; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Auth Modal -->
    <div id="auth-modal" class="fixed inset-0 modal-backdrop z-50 flex items-center justify-center">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 overflow-hidden">
            <div class="bg-gradient-to-r from-blue-600 to-purple-600 p-6 text-white">
                <h2 class="text-2xl font-bold">会员专享</h2>
                <p class="text-blue-100 mt-1">商业点子 & GitHub 热门项目聚合站</p>
            </div>
            
            <div id="login-form-container" class="p-6">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">会员登录</h3>
                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                        <input type="text" id="login-username" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                            placeholder="请输入用户名">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                        <input type="password" id="login-password" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                            placeholder="请输入密码">
                    </div>
                    <button type="submit" class="w-full py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium">
                        登录
                    </button>
                </form>
                <p class="text-center text-sm text-gray-500 mt-4">
                    新用户？请联系会员获取邀请码
                    <button id="switch-to-register" class="text-blue-600 hover:underline ml-1">使用邀请码注册</button>
                </p>
            </div>

            <div id="register-form-container" class="p-6 hidden">
                <h3 class="text-lg font-semibold text-gray-900 mb-4">邀请码注册</h3>
                <form id="register-form" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">用户名</label>
                        <input type="text" id="reg-username" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                            placeholder="设置用户名">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">密码</label>
                        <input type="password" id="reg-password" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                            placeholder="设置密码">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">邀请码 <span class="text-red-500">*</span></label>
                        <input type="text" id="reg-invite-code" required
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                            placeholder="请输入会员邀请码（30分钟内有效）">
                        <p class="text-xs text-gray-400 mt-1">邀请码由已注册会员生成，30分钟后自动失效</p>
                    </div>
                    <button type="submit" class="w-full py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition font-medium">
                        注册
                    </button>
                </form>
                <p class="text-center text-sm text-gray-500 mt-4">
                    已有账号？<button id="switch-to-login" class="text-blue-600 hover:underline">直接登录</button>
                </p>
            </div>
        </div>
    </div>

    <!-- Invite Code Modal -->
    <div id="invite-modal" class="fixed inset-0 modal-backdrop z-50 flex items-center justify-center hidden">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 p-6">
            <h3 class="text-lg font-semibold text-gray-900 mb-4">生成邀请码</h3>
            <p class="text-sm text-gray-500 mb-4">邀请码将在30分钟后自动失效</p>
            <div id="invite-code-display" class="hidden">
                <div class="bg-gray-100 rounded-lg p-4 text-center mb-4">
                    <div id="generated-code" class="text-2xl font-mono font-bold text-blue-600 tracking-wider"></div>
                    <div id="countdown-timer" class="text-sm text-orange-500 mt-2 countdown"></div>
                </div>
                <button id="copy-invite-code" class="w-full py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition">
                    <i class="fas fa-copy mr-2"></i>复制邀请码
                </button>
            </div>
            <button id="generate-invite-btn" class="w-full py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">
                生成新邀请码
            </button>
            <div id="my-invites" class="mt-4 hidden">
                <h4 class="text-sm font-medium text-gray-700 mb-2">我的邀请记录</h4>
                <div id="invites-list" class="space-y-2 max-h-40 overflow-y-auto"></div>
            </div>
            <button id="close-invite-modal" class="w-full py-2 mt-4 border border-gray-300 rounded-lg hover:bg-gray-50 transition">
                关闭
            </button>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-2xl font-bold text-gray-900">💡 商业点子 & GitHub 热门</h1>
                    <p class="text-sm text-gray-500 mt-1">每日更新 · 会员专享</p>
                </div>
                <div class="flex items-center space-x-4">
                    <button id="invite-btn" class="hidden px-4 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition text-sm">
                        <i class="fas fa-user-plus mr-2"></i>邀请好友
                    </button>
                    <div id="user-info" class="hidden flex items-center space-x-3">
                        <span class="text-sm text-gray-600">欢迎, <span id="username-display" class="font-medium"></span></span>
                        <button id="logout-btn" class="text-sm text-red-600 hover:text-red-700">退出</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <!-- Search & Filters -->
        <div class="bg-white rounded-xl shadow-sm p-6 mb-8">
            <div class="flex flex-col md:flex-row gap-4">
                <div class="flex-1 relative">
                    <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                    <input type="text" id="search-input" placeholder="搜索商业点子、GitHub项目..."
                        class="w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                </div>
                <div class="flex gap-2 flex-wrap">
                    <select id="type-filter" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="all">全部类型</option>
                        <option value="business">商业点子</option>
                        <option value="github">GitHub项目</option>
                    </select>
                    <select id="category-filter" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="all">全部分类</option>
                    </select>
                    <select id="date-filter" class="px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                        <option value="all">全部日期</option>
                    </select>
                </div>
            </div>
            <div class="flex gap-2 mt-4 flex-wrap" id="tag-filters"></div>
        </div>

        <!-- Content Grid -->
        <div id="content-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Content will be loaded here -->
        </div>

        <!-- Loading State -->
        <div id="loading" class="text-center py-12 hidden">
            <i class="fas fa-spinner fa-spin text-3xl text-blue-600"></i>
            <p class="text-gray-500 mt-2">加载中...</p>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="text-center py-12 hidden">
            <i class="fas fa-inbox text-4xl text-gray-300"></i>
            <p class="text-gray-500 mt-2">暂无数据</p>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
