<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>💡 灵感引擎 · 商业点子 & GitHub 热门</title>
<style>
  :root {
    --bg: #0b0d17;
    --surface: #121627;
    --surface2: #1a1f35;
    --border: rgba(255,255,255,.06);
    --text: #e2e4e9;
    --text2: #8e93a8;
    --cyan: #22d3ee;
    --purple: #a78bfa;
    --pink: #f472b6;
    --green: #34d399;
    --amber: #fbbf24;
    --red: #f87171;
    --radius: 14px;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;line-height:1.6;min-height:100vh}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 10% 0%,rgba(34,211,238,.06) 0%,transparent 50%),radial-gradient(ellipse at 90% 100%,rgba(167,139,250,.05) 0%,transparent 50%);pointer-events:none;z-index:0}

  .wrap{position:relative;z-index:1;max-width:1280px;margin:0 auto;padding:0 20px}

  /* Header */
  .header{position:sticky;top:0;z-index:50;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);background:rgba(11,13,23,.85);border-bottom:1px solid var(--border)}
  .header-inner{display:flex;align-items:center;justify-content:space-between;padding:14px 0}
  .logo{font-size:1.3rem;font-weight:800;letter-spacing:-.02em}
  .logo span{background:linear-gradient(135deg,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
  .logo-sub{font-size:.7rem;color:var(--text2);margin-top:1px}
  .header-actions{display:flex;gap:8px;align-items:center}
  .user-chip{display:none;align-items:center;gap:8px;background:var(--surface2);border-radius:40px;padding:6px 6px 6px 14px;font-size:.85rem}
  .user-chip.show{display:flex}
  .user-chip .avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--purple),var(--cyan));display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:700}

  /* Buttons */
  .btn{padding:8px 18px;border-radius:40px;border:none;cursor:pointer;font-size:.85rem;font-weight:600;transition:.2s;display:inline-flex;align-items:center;gap:5px}
  .btn-primary{background:linear-gradient(135deg,var(--cyan),var(--purple));color:#fff}
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(34,211,238,.25)}
  .btn-ghost{background:var(--surface2);color:var(--text);border:1px solid var(--border)}
  .btn-ghost:hover{background:#242a40}
  .btn-sm{padding:5px 12px;font-size:.78rem}
  .btn-icon{width:34px;height:34px;padding:0;border-radius:50%;justify-content:center;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:1rem}
  .btn-icon:hover{background:#242a40}
  .btn-fav{color:var(--pink)!important}
  .btn-fav.active{background:rgba(244,114,182,.15)!important;border-color:rgba(244,114,182,.3)!important}

  /* Stats Bar */
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0 20px}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center;transition:.2s}
  .stat-card:hover{border-color:rgba(34,211,238,.2)}
  .stat-val{font-size:1.6rem;font-weight:800;letter-spacing:-.03em}
  .stat-val.c{color:var(--cyan)}.stat-val.p{color:var(--purple)}.stat-val.g{color:var(--green)}.stat-val.a{color:var(--amber)}
  .stat-label{font-size:.72rem;color:var(--text2);margin-top:4px;text-transform:uppercase;letter-spacing:.08em}

  /* Tabs */
  .tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:4px}
  .tab{padding:9px 20px;border-radius:40px;border:1px solid var(--border);background:var(--surface);color:var(--text2);cursor:pointer;font-size:.82rem;font-weight:600;white-space:nowrap;transition:.2s}
  .tab:hover{color:var(--text);border-color:rgba(255,255,255,.15)}
  .tab.active{background:linear-gradient(135deg,rgba(34,211,238,.15),rgba(167,139,250,.1));border-color:rgba(34,211,238,.4);color:var(--cyan)}

  /* Toolbar */
  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
  .search-wrap{flex:1;min-width:200px;position:relative}
  .search-wrap input{width:100%;padding:10px 14px 10px 38px;border-radius:40px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:.85rem;outline:none;transition:.2s}
  .search-wrap input:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(34,211,238,.1)}
  .search-wrap .s-icon{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text2);font-size:.85rem}
  .toolbar select{min-width:130px;padding:10px 16px;border-radius:40px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:.82rem;outline:none;cursor:pointer}
  .toolbar select:focus{border-color:var(--cyan)}

  /* Filter chips */
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:18px}
  .chip{padding:5px 12px;border-radius:40px;border:1px solid var(--border);background:var(--surface2);color:var(--text2);font-size:.72rem;cursor:pointer;white-space:nowrap;transition:.15s}
  .chip:hover{color:var(--text);border-color:rgba(255,255,255,.2)}
  .chip.on{border-color:var(--cyan);color:var(--cyan);background:rgba(34,211,238,.08)}
  .chip-clear{color:var(--red);border-color:transparent;background:transparent}

  /* Grid */
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;padding-bottom:80px}
  @media(max-width:480px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}}

  /* Card */
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:.3s;cursor:pointer;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-3px);border-color:rgba(34,211,238,.25);box-shadow:0 12px 32px rgba(0,0,0,.3)}
  .card-head{padding:16px 18px 0;display:flex;justify-content:space-between;align-items:flex-start}
  .card-body{padding:10px 18px;flex:1}
  .card-foot{padding:12px 18px 16px;display:flex;gap:8px;margin-top:auto}

  .type-badge{padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700;letter-spacing:.03em}
  .type-biz{background:rgba(167,139,250,.12);color:var(--purple)}
  .type-gh{background:rgba(34,211,238,.1);color:var(--cyan)}

  .stars-row{display:flex;align-items:center;gap:3px;font-size:.85rem;color:var(--amber)}
  .stars-row .empty{color:var(--text2)}

  .card h3{font-size:1rem;font-weight:700;margin:10px 0 6px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card p.desc{font-size:.8rem;color:var(--text2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.5}

  .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
  .meta-tag{padding:3px 8px;border-radius:12px;font-size:.68rem;background:var(--surface2);color:var(--text2)}
  .meta-tag.lang{background:rgba(251,191,36,.1);color:var(--amber)}
  .meta-tag.star{background:rgba(34,211,238,.08);color:var(--cyan);font-weight:600}

  .card-foot .btn{flex:1;justify-content:center}
  .card-foot .btn-icon{flex:0 0 34px}

  /* Modal */
  .modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px}
  .modal.show{display:flex}
  .modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px)}
  .modal-box{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:18px;width:100%;max-width:680px;max-height:85vh;overflow-y:auto}
  .modal-header{padding:18px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:2}
  .modal-header h2{font-size:1.1rem;font-weight:700}
  .modal-close{width:32px;height:32px;border-radius:50%;border:1px solid var(--border);background:var(--surface2);color:var(--text);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .modal-close:hover{background:#242a40}
  .modal-body{padding:20px}
  .modal-body .desc-full{font-size:.9rem;color:var(--text);line-height:1.7;white-space:pre-wrap}
  .modal-body .info-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
  .modal-body .info-card{background:var(--surface2);border-radius:12px;padding:14px;text-align:center}
  .modal-body .info-card .info-val{font-size:1.1rem;font-weight:700}
  .modal-body .info-card .info-lbl{font-size:.68rem;color:var(--text2);margin-top:3px}

  /* Auth modal */
  .auth-box{max-width:400px;overflow:hidden}
  .auth-tabs{display:flex}
  .auth-tab{flex:1;padding:12px;text-align:center;font-weight:600;font-size:.85rem;cursor:pointer;background:var(--surface2);color:var(--text2);border:none;transition:.2s}
  .auth-tab.active{background:transparent;color:var(--cyan);border-bottom:2px solid var(--cyan)}
  .auth-form{padding:20px}
  .auth-form input{width:100%;padding:12px 16px;border-radius:12px;background:var(--surface2);border:1px solid var(--border);color:var(--text);font-size:.9rem;margin-bottom:12px;outline:none}
  .auth-form input:focus{border-color:var(--cyan)}
  .auth-form .btn{width:100%;justify-content:center;padding:12px;font-size:.9rem;margin-top:4px}
  .auth-err{color:var(--red);font-size:.78rem;margin-bottom:10px;display:none}
  .auth-err.show{display:block}

  /* Toast */
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--surface);border:1px solid var(--border);color:var(--text);padding:12px 24px;border-radius:40px;font-size:.82rem;z-index:200;transition:.3s;pointer-events:none}
  .toast.show{transform:translateX(-50%) translateY(0)}

  /* Empty / Loading */
  .empty{text-align:center;padding:60px 20px}
  .empty-icon{font-size:3rem;margin-bottom:12px}
  .empty p{color:var(--text2)}
  .sk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
  .sk-card{height:220px;background:var(--surface);border-radius:var(--radius);animation:pulse 1.6s infinite}
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:.8}}

  .count-text{font-size:.8rem;color:var(--text2);margin-bottom:12px}
  .text-right{text-align:right}

  /* Scroll */
  ::-webkit-scrollbar{width:5px}
  ::-webkit-scrollbar-thumb{background:var(--surface2);border-radius:3px}
</style>
</head>
<body>

<div class="wrap">
  <!-- Header -->
  <div class="header">
    <div class="header-inner">
      <div>
        <div class="logo">💡 <span>灵感引擎</span></div>
        <div class="logo-sub" id="lastUpdate">加载数据中...</div>
      </div>
      <div class="header-actions" id="headerActions">
        <button class="btn btn-ghost btn-sm" id="btnLogin">🔐 登录</button>
        <div class="user-chip" id="userChip">
          <span id="userName">用户</span>
          <div class="avatar">郝</div>
          <button class="btn-icon btn-sm" id="btnLogout" title="退出">↪</button>
        </div>
        <button class="btn btn-ghost btn-sm" id="btnInvite" style="display:none">🎫 邀请</button>
      </div>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div class="stat-card"><div class="stat-val c" id="sTotal">-</div><div class="stat-label">总条目</div></div>
    <div class="stat-card"><div class="stat-val p" id="sBiz">-</div><div class="stat-label">商业点子</div></div>
    <div class="stat-card"><div class="stat-val g" id="sGh">-</div><div class="stat-label">GitHub 项目</div></div>
    <div class="stat-card"><div class="stat-val a" id="sDays">-</div><div class="stat-label">覆盖天数</div></div>
  </div>

  <!-- Tabs -->
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="all">全部</button>
    <button class="tab" data-tab="business">💡 商业点子</button>
    <button class="tab" data-tab="github">⚡ GitHub 项目</button>
    <button class="tab" data-tab="favorites" id="tabFav">❤️ 收藏</button>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <div class="search-wrap">
      <span class="s-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="搜索标题、描述、标签...">
    </div>
    <select id="sortSelect">
      <option value="newest">🆕 最新</option>
      <option value="hottest">🔥 热门</option>
      <option value="stars">⭐ Star 排名</option>
    </select>
    <select id="dateSelect"><option value="all">全部日期</option></select>
  </div>

  <!-- Filter Chips -->
  <div class="chips" id="chipBar"></div>

  <!-- Content -->
  <div class="count-text" id="countText"></div>
  <div id="contentGrid" class="grid"></div>
  <div id="loadingGrid" class="sk-grid"></div>
  <div class="empty" id="emptyState" style="display:none">
    <div class="empty-icon">🔍</div>
    <p>没有匹配的内容</p>
    <p style="font-size:.8rem;margin-top:4px">试试调整筛选条件</p>
  </div>
</div>

<!-- Card Detail Modal -->
<div class="modal" id="detailModal">
  <div class="modal-bg" id="detailBg"></div>
  <div class="modal-box">
    <div class="modal-header">
      <h2 id="detailTitle"></h2>
      <button class="modal-close" id="detailClose">✕</button>
    </div>
    <div class="modal-body" id="detailBody"></div>
  </div>
</div>

<!-- Auth Modal -->
<div class="modal" id="authModal">
  <div class="modal-bg" id="authBg"></div>
  <div class="modal-box auth-box">
    <div class="auth-tabs">
      <button class="auth-tab active" id="authTabLogin">登录</button>
      <button class="auth-tab" id="authTabReg">注册</button>
    </div>
    <div id="authLoginForm" class="auth-form">
      <div class="auth-err" id="loginErr"></div>
      <input type="text" id="loginUser" placeholder="用户名">
      <input type="password" id="loginPass" placeholder="密码">
      <button class="btn btn-primary" id="btnDoLogin">登录</button>
    </div>
    <div id="authRegForm" class="auth-form" style="display:none">
      <div class="auth-err" id="regErr"></div>
      <input type="text" id="regUser" placeholder="用户名">
      <input type="password" id="regPass" placeholder="密码">
      <input type="text" id="regInvite" placeholder="邀请码（向已注册会员索取）">
      <button class="btn btn-primary" id="btnDoReg">注册</button>
    </div>
  </div>
</div>

<!-- Invite Modal -->
<div class="modal" id="inviteModal">
  <div class="modal-bg" id="inviteBg"></div>
  <div class="modal-box auth-box">
    <div class="modal-header"><h2>🎫 邀请码</h2><button class="modal-close" id="inviteClose">✕</button></div>
    <div class="modal-body" id="inviteBody"></div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ================ Auth System ================
class Auth {
  constructor() {
    this.user = null;
    this.users = JSON.parse(localStorage.getItem('bizhb_users')||'{}');
    this.codes = JSON.parse(localStorage.getItem('bizhb_codes')||'{}');
    this._initFounder();
    this._restore();
  }
  _hash(p){let h=0;for(let i=0;i<p.length;i++){h=((h<<5)-h)+p.charCodeAt(i);h&=h}return h.toString(16)}
  _initFounder(){if(!this.users['郝仕麟'])this.users['郝仕麟']={username:'郝仕麟',password:this._hash('956244978'),role:'member',createdAt:new Date().toISOString(),favorites:[]};this._saveUsers()}
  _saveUsers(){localStorage.setItem('bizhb_users',JSON.stringify(this.users))}
  _saveCodes(){localStorage.setItem('bizhb_codes',JSON.stringify(this.codes))}
  _restore(){const t=localStorage.getItem('bizhb_token');if(t){try{const p=JSON.parse(decodeURIComponent(atob(t)));if(p.exp>Date.now())this.user=this.users[p.username]||null;else localStorage.removeItem('bizhb_token')}catch{}}}
  _token(u){return btoa(encodeURIComponent(JSON.stringify({username:u.username,role:u.role,exp:Date.now()+30*86400000})))}
  login(user,pass){const u=this.users[user];if(!u)return{ok:false,msg:'用户不存在'};if(u.password!==this._hash(pass))return{ok:false,msg:'密码错误'};this.user=u;localStorage.setItem('bizhb_token',this._token(u));return{ok:true}}
  register(user,pass,code){const v=this._validateCode(code);if(!v.ok)return v;if(this.users[user])return{ok:false,msg:'用户名已存在'};const u={username:user,password:this._hash(pass),inviteCode:code,invitedBy:this.codes[code].createdBy,createdAt:new Date().toISOString(),favorites:[],role:'member'};this.users[user]=u;this.codes[code].used=true;this.codes[code].usedBy=user;this._saveUsers();this._saveCodes();this.user=u;localStorage.setItem('bizhb_token',this._token(u));return{ok:true}}
  logout(){this.user=null;localStorage.removeItem('bizhb_token')}
  _validateCode(c){const i=this.codes[c];if(!i)return{ok:false,msg:'邀请码不存在'};if(i.used)return{ok:false,msg:'邀请码已被使用'};if(Date.now()>i.expiresAt)return{ok:false,msg:'邀请码已过期'};return{ok:true}}
  genCode(){if(!this.user)return null;const c=Array.from({length:8},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*32)]).join('');this.codes[c]={createdBy:this.user.username,createdAt:Date.now(),expiresAt:Date.now()+1800000,used:false};this._saveCodes();return c}
  loggedIn(){return !!this.user}
  fav(id){if(!this.user)return false;return this.user.favorites.includes(id)}
  toggleFav(id){if(!this.user)return;const i=this.user.favorites.indexOf(id);if(i>-1)this.user.favorites.splice(i,1);else this.user.favorites.push(id);this.users[this.user.username].favorites=this.user.favorites;this._saveUsers()}
}

// ================ App ================
const A=new Auth();
let DATA={entries:[],dates:[]},tab='all',sort='newest',search='',date='all',activFilt=new Set();

function $(id){return document.getElementById(id)}

// Load data
async function loadData(){
  $('loadingGrid').innerHTML=Array(6).fill('<div class="sk-card"></div>').join('');
  $('loadingGrid').style.display='grid';
  try{const r=await fetch('data.json?t='+Date.now());DATA=await r.json();
    if(DATA.lastUpdate)$('lastUpdate').textContent='数据更新于 '+new Date(DATA.lastUpdate).toLocaleDateString('zh-CN');
    buildDateOpts();render();
  }catch(e){DATA={entries:[],dates:[]};$('lastUpdate').textContent='数据加载失败'}
  $('loadingGrid').style.display='none';
}

function buildDateOpts(){
  const s=$('dateSelect');
  s.innerHTML='<option value="all">全部日期</option>'+(DATA.dates||[]).map(d=>'<option value="'+d+'">'+d+'</option>').join('');
}

// Stats
function updateStats(entries){
  $('sTotal').textContent=entries.length;
  $('sBiz').textContent=entries.filter(e=>e.type==='business').length;
  $('sGh').textContent=entries.filter(e=>e.type==='github').length;
  $('sDays').textContent=DATA.dates.length;
}

// ================ Filters ================
function filtered(){
  let e=[...DATA.entries];
  if(tab==='business')e=e.filter(x=>x.type==='business');
  else if(tab==='github')e=e.filter(x=>x.type==='github');
  else if(tab==='favorites')e=e.filter((_,i)=>A.fav((e[i]?.type||'')+'-'+i));
  if(date!=='all')e=e.filter(x=>x.date===date);
  if(search){const q=search.toLowerCase();e=e.filter(x=>(x.title||x.name||'').toLowerCase().includes(q)||(x.description||'').toLowerCase().includes(q)||(x.tags||[]).some(t=>t.toLowerCase().includes(q))||(x.topics||[]).some(t=>t.toLowerCase().includes(q))||(x.language||'').toLowerCase().includes(q))}
  if(activFilt.size>0){e=e.filter(x=>{const s=new Set();if(x.type==='business'){(x.tags||[]).forEach(t=>s.add('t:'+t));s.add('p:'+(x.potential||3))}else{(x.topics||[]).forEach(t=>s.add('t:'+t));if(x.language)s.add('l:'+x.language)}let m=false;activFilt.forEach(f=>{if(s.has(f))m=true});return m})}
  if(sort==='hottest')e.sort((a,b)=>{const sa=a.type==='github'?(a.stars||0):((a.potential||3)*1000);const sb=b.type==='github'?(b.stars||0):((b.potential||3)*1000);return sb-sa});
  else if(sort==='stars')e.sort((a,b)=>(b.stars||0)-(a.stars||0));
  else e.sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  return e;
}

function buildFilters(entries){
  const m=new Map();
  entries.forEach(x=>{
    if(x.type==='business'){(x.tags||[]).forEach(t=>{const k='t:'+t;m.set(k,(m.get(k)||0)+1)});const k='p:'+(x.potential||3);m.set(k,(m.get(k)||0)+1)}
    else{(x.topics||[]).forEach(t=>{const k='t:'+t;m.set(k,(m.get(k)||0)+1)});if(x.language){const k='l:'+x.language;m.set(k,(m.get(k)||0)+1)}}
  });
  const sorted=[...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,25);
  let h=activFilt.size?'<button class="chip chip-clear" id="clearChips">✕ 清除</button>':'';
  sorted.forEach(([k,c])=>{
    const on=activFilt.has(k);
    let label=k;let cls='';
    if(k.startsWith('t:')){label=k.slice(2);cls='t:'}
    else if(k.startsWith('l:')){label=k.slice(2);cls='l:'}
    else if(k.startsWith('p:')){label='★'.repeat(parseInt(k.slice(2)));cls='p:'}
    h+='<button class="chip'+(on?' on':'')+'" data-key="'+k+'">'+esc(label)+' <span style="opacity:.5">'+c+'</span></button>';
  });
  $('chipBar').innerHTML=h;
}

// ================ Card Render ================
function esc(s){if(!s)return'';return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(n){if(!n)return'0';if(n>=1000)return(n/1000).toFixed(1)+'k';return String(n)}

function bizCard(e,i){
  const id='business-'+i,p=e.potential||3;
  let stars='';for(let j=0;j<5;j++)stars+=j<p?'★':'☆';
  const fav=A.fav(id);
  return '<div class="card" onclick="showDetail('+i+')"><div class="card-head">'+
    '<span class="type-badge type-biz">💡 商业点子</span>'+
    '<span class="stars-row">'+stars+'</span></div><div class="card-body">'+
    '<h3>'+esc(e.title)+'</h3><p class="desc">'+esc(e.description||'')+'</p>'+
    '<div class="meta">'+(e.tags||[]).slice(0,4).map(t=>'<span class="meta-tag" onclick="event.stopPropagation();toggleFilt(\'t:'+esc(t)+'\')">'+esc(t)+'</span>').join('')+'</div></div>'+
    '<div class="card-foot"><button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();showDetail('+i+')">📋 详情</button>'+
    '<button class="btn-icon btn-fav'+(fav?' active':'')+'" onclick="event.stopPropagation();doFav(\''+id+'\')">'+(fav?'❤️':'🤍')+'</button></div></div>';
}

function ghCard(e,i){
  const id='github-'+i,rn=(e.name||'').split('/')[1]||e.name||'';
  const fav=A.fav(id);
  return '<div class="card" onclick="showDetail('+i+')"><div class="card-head">'+
    '<span class="type-badge type-gh">⚡ GitHub</span></div><div class="card-body">'+
    '<h3>'+esc(rn)+'</h3><p class="desc">'+esc(e.name||'')+'</p>'+
    '<p class="desc" style="margin-top:4px">'+esc(e.description||'暂无描述')+'</p>'+
    '<div class="meta"><span class="meta-tag star">⭐ '+fmt(e.stars||0)+'</span>'+
    (e.language?'<span class="meta-tag lang" onclick="event.stopPropagation();toggleFilt(\'l:'+esc(e.language)+'\')">● '+esc(e.language)+'</span>':'')+
    '<span class="meta-tag">🍴 '+fmt(e.forks||0)+'</span>'+
    (e.topics||[]).slice(0,3).map(t=>'<span class="meta-tag" onclick="event.stopPropagation();toggleFilt(\'t:'+esc(t)+'\')">'+esc(t)+'</span>').join('')+'</div></div>'+
    '<div class="card-foot"><a href="'+(e.url||'#')+'" target="_blank" class="btn btn-ghost btn-sm" onclick="event.stopPropagation()" style="text-decoration:none">🔗 GitHub</a>'+
    '<button class="btn-icon btn-fav'+(fav?' active':'')+'" onclick="event.stopPropagation();doFav(\''+id+'\')">'+(fav?'❤️':'🤍')+'</button></div></div>';
}

// ================ Detail Modal ================
function showDetail(i){
  const e=DATA.entries[i];if(!e)return;
  const m=$('detailModal'),t=$('detailTitle'),b=$('detailBody');
  if(e.type==='business'){
    const p=e.potential||3;let stars='';for(let j=0;j<5;j++)stars+=j<p?'★':'☆';
    t.textContent=e.title;
    b.innerHTML='<div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:16px"><span class="type-badge type-biz">💡 商业点子</span><span class="stars-row">'+stars+'</span></div>'+
      '<div class="desc-full">'+esc(e.description||'')+'</div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:14px">'+(e.tags||[]).map(t=>'<span class="meta-tag" onclick="toggleFilt(\'t:'+esc(t)+'\');closeDetail()">'+esc(t)+'</span>').join('')+'</div>'+
      '<div class="info-grid"><div class="info-card"><div class="info-val" style="color:var(--cyan)">'+(e.marketSize||'待验证')+'</div><div class="info-lbl">市场规模</div></div>'+
      '<div class="info-card"><div class="info-val" style="color:var(--green)">'+(e.competition||'中')+'</div><div class="info-lbl">竞争程度</div></div>'+
      '<div class="info-card"><div class="info-val" style="color:var(--amber)">'+(e.investment||'待评估')+'</div><div class="info-lbl">启动资金</div></div></div>';
  }else{
    t.textContent=(e.name||'').split('/')[1]||e.name||'';
    b.innerHTML='<div style="margin-bottom:14px"><span class="type-badge type-gh">⚡ GitHub</span></div>'+
      '<div class="desc-full">'+(e.name||'')+'</div>'+
      '<div class="desc-full" style="margin-top:12px">'+esc(e.description||'暂无描述')+'</div>'+
      '<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:14px">'+
      '<span class="meta-tag star">⭐ '+(e.stars||0).toLocaleString()+'</span>'+
      '<span class="meta-tag">🍴 '+(e.forks||0).toLocaleString()+'</span>'+
      (e.language?'<span class="meta-tag lang">● '+esc(e.language)+'</span>':'')+'</div>'+
      (e.topics?.length?'<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px">'+(e.topics||[]).map(t=>'<span class="meta-tag" onclick="toggleFilt(\'t:'+esc(t)+'\');closeDetail()">'+esc(t)+'</span>').join('')+'</div>':'')+
      '<div style="margin-top:18px"><a href="'+(e.url||'#')+'" target="_blank" class="btn btn-primary" style="text-decoration:none">🔗 前往 GitHub</a></div>';
  }
  m.classList.add('show');
}

function closeDetail(){$('detailModal').classList.remove('show')}

function doFav(id){if(!A.loggedIn()){showAuth();return}A.toggleFav(id);render()}

function toggleFilt(k){if(activFilt.has(k))activFilt.delete(k);else activFilt.add(k);render()}

// ================ Auth UI ================
function showAuth(){$('authModal').classList.add('show');$('loginErr').classList.remove('show');$('regErr').classList.remove('show')}
function hideAuth(){$('authModal').classList.remove('show')}
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}

$('btnLogin').onclick=showAuth;
$('authBg').onclick=hideAuth;
$('authTabLogin').onclick=()=>{$('authLoginForm').style.display='';$('authRegForm').style.display='none';$('authTabLogin').classList.add('active');$('authTabReg').classList.remove('active')};
$('authTabReg').onclick=()=>{$('authRegForm').style.display='';$('authLoginForm').style.display='none';$('authTabReg').classList.add('active');$('authTabLogin').classList.remove('active')};

$('btnDoLogin').onclick=()=>{
  const u=$('loginUser').value.trim(),p=$('loginPass').value;
  if(!u||!p){$('loginErr').textContent='请填写用户名和密码';$('loginErr').classList.add('show');return}
  const r=A.login(u,p);
  if(r.ok){hideAuth();updateAuthUI();render();toast('✅ 欢迎回来，'+u)}
  else{$('loginErr').textContent=r.msg;$('loginErr').classList.add('show')}
};

$('btnDoReg').onclick=()=>{
  const u=$('regUser').value.trim(),p=$('regPass').value,c=$('regInvite').value.trim();
  if(!u||!p||!c){$('regErr').textContent='请填写所有字段';$('regErr').classList.add('show');return}
  const r=A.register(u,p,c);
  if(r.ok){hideAuth();updateAuthUI();render();toast('🎉 注册成功，欢迎 '+u)}
  else{$('regErr').textContent=r.msg;$('regErr').classList.add('show')}
};

$('btnLogout').onclick=()=>{A.logout();updateAuthUI();render();toast('👋 已退出')};

// Invite
$('btnInvite').onclick=()=>{
  const c=A.genCode();
  if(!c){toast('请先登录');return}
  $('inviteBody').innerHTML='<p style="margin-bottom:12px">你的邀请码（30分钟内有效）：</p><div style="background:var(--surface2);border-radius:12px;padding:20px;text-align:center;font-size:2rem;font-weight:800;letter-spacing:.15em;color:var(--cyan);font-family:monospace">'+c+'</div><button class="btn btn-primary" style="width:100%;margin-top:14px" onclick="navigator.clipboard.writeText(\''+c+'\');toast(\'📋 已复制\')">📋 复制邀请码</button>';
  $('inviteModal').classList.add('show');
};
$('inviteBg').onclick=()=>$('inviteModal').classList.remove('show');
$('inviteClose').onclick=()=>$('inviteModal').classList.remove('show');

function updateAuthUI(){
  if(A.loggedIn()){
    $('btnLogin').style.display='none';$('userChip').classList.add('show');
    $('userName').textContent=A.user.username;$('btnInvite').style.display='';
  }else{
    $('btnLogin').style.display='';$('userChip').classList.remove('show');
    $('btnInvite').style.display='none';
  }
}

// ================ Render ================
function render(){
  const entries=filtered();
  updateStats(entries);
  $('countText').textContent='共 '+entries.length+' 条内容';

  if(entries.length===0){$('contentGrid').innerHTML='';$('emptyState').style.display=''}
  else{$('emptyState').style.display='none';$('contentGrid').innerHTML=entries.map((e,i)=>e.type==='business'?bizCard(e,DATA.entries.indexOf(e)):ghCard(e,DATA.entries.indexOf(e))).join('')}

  // Build filter chips from unfiltered set (same tab/date/search but no chip filter)
  const base=[...DATA.entries];
  let be=base;
  if(tab==='business')be=be.filter(x=>x.type==='business');
  else if(tab==='github')be=be.filter(x=>x.type==='github');
  else if(tab==='favorites')be=be.filter((_,i)=>A.fav((be[i]?.type||'')+'-'+i));
  if(date!=='all')be=be.filter(x=>x.date===date);
  if(search){const q=search.toLowerCase();be=be.filter(x=>(x.title||x.name||'').toLowerCase().includes(q)||(x.description||'').toLowerCase().includes(q)||(x.tags||[]).some(t=>t.toLowerCase().includes(q))||(x.topics||[]).some(t=>t.toLowerCase().includes(q))||(x.language||'').toLowerCase().includes(q))}
  buildFilters(be);
}

// ================ Events ================
document.querySelectorAll('#tabs .tab').forEach(btn=>btn.onclick=function(){
  tab=this.dataset.tab;activFilt.clear();
  document.querySelectorAll('#tabs .tab').forEach(b=>b.classList.remove('active'));this.classList.add('active');
  render();
});

$('sortSelect').onchange=function(){sort=this.value;render()};
$('dateSelect').onchange=function(){date=this.value;render()};

let searchTimer;
$('searchInput').oninput=function(){clearTimeout(searchTimer);searchTimer=setTimeout(()=>{search=this.value.trim();render()},250)};

$('chipBar').addEventListener('click',function(e){
  const chip=e.target.closest('.chip');if(!chip)return;
  if(chip.id==='clearChips'){activFilt.clear();render();return}
  const k=chip.dataset.key;if(!k)return;
  if(activFilt.has(k))activFilt.delete(k);else activFilt.add(k);
  render();
});

$('detailBg').onclick=closeDetail;$('detailClose').onclick=closeDetail;
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDetail();hideAuth()}});

// ================ Init ================
updateAuthUI();
loadData();
</script>
</body>
</html>
